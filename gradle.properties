# JVM tuning for ForgeGradle (1.20.1 needs plenty of heap for decompile)
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true

# Mod identity
mod_id=cobbleballworks
mod_name=Cobblemon Ballworks
mod_license=MIT
mod_version=0.1.0
mod_group_id=com.xaiver.cobbleballworks
mod_authors=xaiver
mod_description=Manual Poke Ball parts crafting for Cobblemon. Restores the Pixelmon-style feel where Poke Balls are assembled from parts.

# Minecraft / Forge target
minecraft_version=1.20.1
# Allowed MC range in mods.toml (inclusive lower, exclusive upper)
minecraft_version_range=[1.20.1,1.21)
forge_version=47.2.8
forge_version_range=[47.2.8,)
loader_version_range=[47,)

# Mappings (Parchment is an overlay on official; these are the values used for deobf)
mapping_channel=official
mapping_version=1.20.1

# Kotlin for Forge
kff_version=4.10.0

# Cobblemon
cobblemon_version=1.4.0+1.20.1
cobblemon_version_range=[1.4.0,1.6)
