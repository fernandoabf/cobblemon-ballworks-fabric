plugins {
    id 'fabric-loom'
    id 'org.jetbrains.kotlin.jvm'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Loom already adds the Fabric maven, Mojang's libraries and Maven Central.
    mavenCentral()
    // EMI (recipe viewer used by the modpack): compile against its API, run it in dev.
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
        content { includeGroup 'dev.emi' }
    }
}

// ---------------------------------------------------------------------------
// Real Cobblemon (the same jar the modpack/server runs), used ONLY at dev
// runtime (gametest). It is downloaded from Modrinth into run-libs/
// (git-ignored) the first time Gradle configures the project. Ballworks does not compile against Cobblemon classes: it only
// references Cobblemon items by id (cobblemon:poke_ball, ...) in data files.
// ---------------------------------------------------------------------------
if (JavaVersion.current() < JavaVersion.VERSION_21) {
    throw new GradleException("[cobbleballworks] Gradle is running on Java ${JavaVersion.current()}; " +
            "Minecraft 1.21.1 / Loom need JDK 21. Install a JDK 21 and point JAVA_HOME to it (or use ./dgradle.sh).")
}

def cobblemonJar = file("run-libs/Cobblemon-fabric-${project.cobblemon_version}.jar")

// The jar is the official release from Modrinth (same file the modpack/server run). It is
// downloaded once into run-libs/ (git-ignored) and checked against its SHA-1.
// Skip with -Pcobbleballworks.noCobblemonDownload=true or when Gradle runs --offline.
if (!cobblemonJar.isFile() && !gradle.startParameter.offline &&
        !project.hasProperty('cobbleballworks.noCobblemonDownload')) {
    def url = project.cobblemon_url
    def expected = project.cobblemon_sha1
    logger.lifecycle("[cobbleballworks] Downloading Cobblemon ${project.cobblemon_version} for dev runtime: ${url}")
    cobblemonJar.parentFile.mkdirs()
    def tmp = new File(cobblemonJar.parentFile, cobblemonJar.name + '.part')
    def conn = new URL(url).openConnection()
    conn.setRequestProperty('User-Agent', 'cobbleballworks-build (github.com/fernandoabf/cobblemon-ballworks-fabric)')
    conn.inputStream.withStream { input -> tmp.withOutputStream { out -> out << input } }
    def sha1 = java.security.MessageDigest.getInstance('SHA-1').digest(tmp.bytes).encodeHex().toString()
    if (sha1 != expected) {
        tmp.delete()
        throw new GradleException("[cobbleballworks] Cobblemon jar SHA-1 mismatch: expected ${expected}, got ${sha1}")
    }
    tmp.renameTo(cobblemonJar)
}
def hasCobblemon = cobblemonJar.isFile()
if (!hasCobblemon) {
    logger.warn("[cobbleballworks] ${cobblemonJar} not found: dev runs/gametest will NOT have Cobblemon " +
            "(and cobbleballworks depends on it). Download it from ${project.cobblemon_url} into run-libs/.")
}

// Loom strips the jar-in-jar list ("jars" in fabric.mod.json) from remapped mod
// dependencies, so in dev the libraries Cobblemon nests (GraalJS/Truffle for
// Showdown, ICU4J, MongoDB driver) must be put on the runtime classpath by us.
// We take the exact nested jars from the real Cobblemon jar (fabric-language-kotlin
// is excluded: it comes from Maven via modImplementation below, same version).
def cobblemonJijDir = layout.buildDirectory.dir('cobblemon-jij')
def extractCobblemonJij = tasks.register('extractCobblemonJij', Sync) {
    group = 'cobbleballworks'
    description = 'Extracts the jar-in-jar libraries nested in the real Cobblemon jar (run-libs/).'
    if (hasCobblemon) {
        from(zipTree(cobblemonJar)) {
            include 'META-INF/jars/*.jar'
            exclude 'META-INF/jars/fabric-language-kotlin-*.jar'
            eachFile { it.path = it.name }
        }
    }
    includeEmptyDirs = false
    into cobblemonJijDir
}

loom {
    // src/main = common/server-safe code, src/client = client-only code
    // (renderers etc.). Loom makes main unable to reference net.minecraft.client.*,
    // which protects the dedicated server.
    splitEnvironmentSourceSets()
}

sourceSets {
    // Headless Fabric gametests (fabric-gametest-api-v1), run on a dedicated test server.
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
    // Dev-only client showcase: builds scenes and takes screenshots (./gradlew runShowcase).
    showcase {
        compileClasspath += sourceSets.client.compileClasspath + sourceSets.main.output + sourceSets.client.output
        runtimeClasspath += sourceSets.client.runtimeClasspath + sourceSets.main.output + sourceSets.client.output
    }
}

loom {
    mods {
        cobbleballworks {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
        register('cobbleballworks-gametest') {
            sourceSet sourceSets.gametest
        }
        register('cobbleballworks-showcase') {
            sourceSet sourceSets.showcase
        }
    }

    runs {
        // ./dgradle.sh runGametest -> headless dedicated gametest server that runs every
        // @GameTest and exits by itself (exit code != 0 if a required test fails).
        gametest {
            server()
            name 'Game Test (headless server)'
            source sourceSets.gametest
            runDir 'build/gametest'
            vmArg '-Xmx3G'
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${file('build/gametest/junit.xml').absolutePath}"
            ideConfigGenerated false
        }
        // xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runShowcase -> screenshots in
        // build/showcase/screenshots, then the client quits by itself.
        showcase {
            client()
            name 'Showcase (client screenshots)'
            source sourceSets.showcase
            runDir 'build/showcase'
            vmArg '-Xmx4G'
            vmArg '-Dcobbleballworks.showcase=true'
            programArgs '--width', '1280', '--height', '720'
            ideConfigGenerated false
        }
    }
}

// Fresh gametest world on every run (the gametest server otherwise reuses build/gametest/world).
tasks.matching { it.name == 'runGametest' }.configureEach {
    doFirst {
        delete(file('build/gametest/world'))
    }
}

// Fresh showcase world and screenshots; options that keep an unattended client going (no
// accessibility onboarding, no pause when the window has no focus, no sound, short view distance).
def prepareShowcaseDir = { File dir ->
    delete(new File(dir, 'saves'), new File(dir, 'screenshots'))
    dir.mkdirs()
    new File(dir, 'options.txt').text = [
        'onboardAccessibility:false', 'pauseOnLostFocus:false', 'tutorialStep:none',
        'joinedFirstServer:true', 'skipMultiplayerWarning:true', 'renderDistance:4',
        'simulationDistance:5', 'soundCategory_master:0.0', 'narrator:0', 'guiScale:2',
        "lang:${project.findProperty('showcaseLang') ?: 'en_us'}",
    ].join('\n') + '\n'
}
tasks.matching { it.name == 'runShowcase' }.configureEach {
    doFirst { prepareShowcaseDir(file('build/showcase')) }
}

// ./gradlew runProductionGametest -> the same gametests on a production Fabric server: the
// official installer/launcher, intermediary names, our remapped jar and the published Fabric API
// and Cobblemon jars, as on a real server. Exits by itself, != 0 if a test fails.
def gametestDevJar = tasks.register('gametestDevJar', Jar) {
    from sourceSets.gametest.output
    archiveClassifier = 'gametest-dev'
    destinationDirectory = layout.buildDirectory.dir('devlibs')
}
def remapGametestJar = tasks.register('remapGametestJar', net.fabricmc.loom.task.RemapJarTask) {
    inputFile = gametestDevJar.flatMap { it.archiveFile }
    classpath.from(sourceSets.main.output, sourceSets.main.compileClasspath)
    archiveClassifier = 'gametest'
    destinationDirectory = layout.buildDirectory.dir('prodgametest-mods')
    addNestedDependencies = false
}
tasks.register('runProductionGametest', net.fabricmc.loom.task.prod.ServerProductionRunTask) {
    group = 'verification'
    description = 'Runs every gametest on a production Fabric server with the remapped jars.'
    mods.from(remapGametestJar)
    jvmArgs.addAll('-Xmx3G', '-Dfabric-api.gametest',
            "-Dfabric-api.gametest.report-file=${file('build/prodgametest/junit.xml').absolutePath}")
    runDir = layout.buildDirectory.dir('prodgametest')
    doFirst {
        delete(file('build/prodgametest/world'))
        file('build/prodgametest').mkdirs()
    }
}

// xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runProductionShowcase -> the showcase on a
// production client (intermediary names) with the published EMI, Cobblemon and Fabric API jars;
// screenshots in build/prodshowcase/screenshots.
configurations {
    productionClientMods { transitive = false }
}
def showcaseDevJar = tasks.register('showcaseDevJar', Jar) {
    from sourceSets.showcase.output
    archiveClassifier = 'showcase-dev'
    destinationDirectory = layout.buildDirectory.dir('devlibs')
}
def remapShowcaseJar = tasks.register('remapShowcaseJar', net.fabricmc.loom.task.RemapJarTask) {
    inputFile = showcaseDevJar.flatMap { it.archiveFile }
    classpath.from(sourceSets.main.output, sourceSets.client.output, sourceSets.client.compileClasspath)
    archiveClassifier = 'showcase'
    destinationDirectory = layout.buildDirectory.dir('prodshowcase-mods')
    addNestedDependencies = false
}
tasks.register('runProductionShowcase', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    group = 'verification'
    description = 'Runs the client showcase on a production client with the remapped jars.'
    mods.from(remapShowcaseJar, configurations.productionClientMods)
    jvmArgs.addAll('-Xmx4G', '-Dcobbleballworks.showcase=true')
    programArgs.addAll('--width', '1280', '--height', '720')
    runDir = layout.buildDirectory.dir('prodshowcase')
    useXVFB = false // run the whole Gradle command under xvfb-run, as for runShowcase
    doFirst { prepareShowcaseDir(file('build/prodshowcase')) }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Full Fabric API (includes fabric-gametest-api-v1).
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modImplementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"

    // EMI plugin (src/client/.../compat/emi): only the API at compile time; the full mod in dev
    // runs so the showcase can screenshot it. Players get it from their own modpack.
    modCompileOnly "dev.emi:emi-fabric:${project.emi_version}:api"
    modLocalRuntime "dev.emi:emi-fabric:${project.emi_version}"

    // Published (intermediary) jars for the production runs; Loom adds our remapJar itself.
    productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    productionClientMods "dev.emi:emi-fabric:${project.emi_version}"

    if (hasCobblemon) {
        productionRuntimeMods files(cobblemonJar)
        modLocalRuntime files(cobblemonJar)
        localRuntime fileTree(cobblemonJijDir) {
            include '*.jar'
            builtBy extractCobblemonJij
        }
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

jar {
    inputs.property 'archivesName', project.base.archivesName
    from('LICENSE') {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}
